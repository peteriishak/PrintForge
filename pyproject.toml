[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printforge"
version = "1.0.0"
description = "A modern, polished printing application for Fedora Linux"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Peter Habib"}
]
keywords = ["printing", "cups", "gtk4", "libadwaita", "fedora", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
    "Pillow>=9.0.0",
    "pycups>=2.0.1",
]

[project.optional-dependencies]
highlight = [
    "Pygments>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
printforge = "printforge.__main__:main"

[project.urls]
Homepage = "https://github.com/peteriishak/PrintForge"
Repository = "https://github.com/peteriishak/PrintForge"
"Bug Tracker" = "https://github.com/peteriishak/PrintForge/issues"

[tool.setuptools.packages.find]
include = ["printforge*"]

[tool.setuptools.package-data]
printforge = ["ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
